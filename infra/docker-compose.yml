services:

  mysql:
    image: mysql:8.0
    container_name: backend-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bank_xyz_semana5_db
      MYSQL_USER: bank_batch_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./bank_xyz_semana5_db.sql:/docker-entrypoint-initdb.d/01-bank-xyz.sql:ro
      - ../bff/sql/03-gestion-cuentas.sql:/docker-entrypoint-initdb.d/03-gestion-cuentas.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  kafka:
    image: apache/kafka:3.9.0
    container_name: backend-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 8s
      retries: 15
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: backend-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic movimientos.creados --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic operaciones.procesadas --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic operaciones.fallidas --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: backend-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  config-server:
    build:
      context: ../bff/config-server
    image: banco-xyz/config-server:semana8
    container_name: backend-config-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      CONFIG_REPO: file:/config-repo
    volumes:
      - ../bff/config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  discovery-server:
    build:
      context: ../bff/discovery-server
    image: banco-xyz/discovery-server:semana8
    container_name: backend-discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  auth-server:
    build:
      context: ../bff/auth-server
    image: banco-xyz/auth-server:semana8
    container_name: backend-auth-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      OAUTH_WEB_SECRET: ${OAUTH_WEB_SECRET:?Define OAUTH_WEB_SECRET}
      OAUTH_MOVIL_SECRET: ${OAUTH_MOVIL_SECRET:?Define OAUTH_MOVIL_SECRET}
      OAUTH_CAJERO_SECRET: ${OAUTH_CAJERO_SECRET:?Define OAUTH_CAJERO_SECRET}
      OAUTH_ISSUER: http://localhost:9000
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: auth-server
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9000/.well-known/oauth-authorization-server >/dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  ms-cuentas:
    build:
      context: ../bff/ms-cuentas
    image: banco-xyz/ms-cuentas:semana8
    container_name: backend-ms-cuentas
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: ms-cuentas
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://mysql:3306/bank_xyz_semana5_db?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
      DB_USER: bank_batch_user
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      BACKEND_BASIC_USER: svc-bff
      BACKEND_BASIC_PASSWORD: ${BACKEND_BASIC_PASSWORD:?Define BACKEND_BASIC_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8091/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s

  ms-movimientos:
    build:
      context: ../bff/ms-movimientos
    image: banco-xyz/ms-movimientos:semana8
    container_name: backend-ms-movimientos
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:8092"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: ms-movimientos
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://mysql:3306/bank_xyz_semana5_db?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
      DB_USER: bank_batch_user
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      BACKEND_BASIC_USER: svc-bff
      BACKEND_BASIC_PASSWORD: ${BACKEND_BASIC_PASSWORD:?Define BACKEND_BASIC_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8092/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s

  ms-operaciones:
    build:
      context: ../bff/ms-operaciones
    image: banco-xyz/ms-operaciones:semana8
    container_name: backend-ms-operaciones
    restart: unless-stopped
    ports:
      - "127.0.0.1:8093:8093"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: ms-operaciones
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://mysql:3306/bank_xyz_semana5_db?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
      DB_USER: bank_batch_user
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      BACKEND_BASIC_USER: svc-bff
      BACKEND_BASIC_PASSWORD: ${BACKEND_BASIC_PASSWORD:?Define BACKEND_BASIC_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      mysql:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8093/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s

  bff-web:
    build:
      context: ../bff/bff-web
    image: banco-xyz/bff-web:semana8
    container_name: backend-bff-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: bff-web
      SERVER_ADDRESS: 0.0.0.0
      OAUTH_ISSUER: http://localhost:9000
      OAUTH_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      BFF_TLS_STORE: file:/certs/web.p12
      BFF_TLS_PASSWORD: ${BFF_TLS_PASSWORD:?Define BFF_TLS_PASSWORD}
      BACKEND_BASIC_USER: svc-bff
      BACKEND_BASIC_PASSWORD: ${BACKEND_BASIC_PASSWORD:?Define BACKEND_BASIC_PASSWORD}
    volumes:
      - ../bff/tls:/certs:ro
    depends_on:
      auth-server:
        condition: service_healthy
      ms-cuentas:
        condition: service_healthy
      ms-movimientos:
        condition: service_healthy
      ms-operaciones:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost:8081/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s

  bff-movil:
    build:
      context: ../bff/bff-movil
    image: banco-xyz/bff-movil:semana8
    container_name: backend-bff-movil
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: bff-movil
      SERVER_ADDRESS: 0.0.0.0
      OAUTH_ISSUER: http://localhost:9000
      OAUTH_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      BFF_TLS_STORE: file:/certs/movil.p12
      BFF_TLS_PASSWORD: ${BFF_TLS_PASSWORD:?Define BFF_TLS_PASSWORD}
      BACKEND_BASIC_USER: svc-bff
      BACKEND_BASIC_PASSWORD: ${BACKEND_BASIC_PASSWORD:?Define BACKEND_BASIC_PASSWORD}
    volumes:
      - ../bff/tls:/certs:ro
    depends_on:
      auth-server:
        condition: service_healthy
      ms-cuentas:
        condition: service_healthy
      ms-movimientos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost:8082/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s

  bff-cajero:
    build:
      context: ../bff/bff-cajero
    image: banco-xyz/bff-cajero:semana8
    container_name: backend-bff-cajero
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: bff-cajero
      SERVER_ADDRESS: 0.0.0.0
      OAUTH_ISSUER: http://localhost:9000
      OAUTH_JWK_SET_URI: http://auth-server:9000/oauth2/jwks
      BFF_TLS_STORE: file:/certs/cajero.p12
      BFF_TLS_PASSWORD: ${BFF_TLS_PASSWORD:?Define BFF_TLS_PASSWORD}
      BACKEND_BASIC_USER: svc-bff
      BACKEND_BASIC_PASSWORD: ${BACKEND_BASIC_PASSWORD:?Define BACKEND_BASIC_PASSWORD}
    volumes:
      - ../bff/tls:/certs:ro
    depends_on:
      auth-server:
        condition: service_healthy
      ms-cuentas:
        condition: service_healthy
      ms-operaciones:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost:8083/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s

volumes:
  mysql_data:
  kafka_data:

