<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#17202a}
      .subtitle{font:400 18px Arial,sans-serif;fill:#566573}
      .section{font:700 19px Arial,sans-serif;fill:#34495e}
      .boxTitle{font:700 18px Arial,sans-serif;fill:#17202a}
      .boxText{font:400 15px Arial,sans-serif;fill:#2c3e50}
      .small{font:400 14px Arial,sans-serif;fill:#5d6d7e}
      .topic{font:700 15px Arial,sans-serif;fill:#17202a}
      .outer{fill:#fbfcfc;stroke:#aeb6bf;stroke-width:2}
      .client{fill:#eaf2f8;stroke:#5dade2;stroke-width:2}
      .auth{fill:#fef5e7;stroke:#f5b041;stroke-width:2}
      .bff{fill:#e8f8f5;stroke:#48c9b0;stroke-width:2}
      .support{fill:#f4ecf7;stroke:#af7ac5;stroke-width:2}
      .ms{fill:#ebf5fb;stroke:#3498db;stroke-width:2}
      .db{fill:#fdf2e9;stroke:#e67e22;stroke-width:2}
      .kafka{fill:#f9ebea;stroke:#cd6155;stroke-width:2}
      .topicBox{fill:#ffffff;stroke:#cd6155;stroke-width:1.7}
      .legend{fill:#f8f9f9;stroke:#85929e;stroke-width:1.6}
      .arrow{stroke:#566573;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#7d3c98;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrowPurple)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#566573"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7d3c98"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1560" height="1080" rx="18" class="outer"/>
  <text x="800" y="66" text-anchor="middle" class="title">Arquitectura de la solución – Semana 8</text>
  <text x="800" y="94" text-anchor="middle" class="subtitle">Banco XYZ · OAuth2 · Spring Cloud · Kafka · Docker Compose sobre AWS EC2</text>

  <text x="60" y="132" class="section">Clientes y pruebas</text>
  <rect x="60" y="148" width="220" height="72" rx="12" class="client"/>
  <text x="170" y="178" text-anchor="middle" class="boxTitle">Postman</text>
  <text x="170" y="202" text-anchor="middle" class="boxText">Pruebas 200 / 401 / 403</text>

  <rect x="330" y="148" width="220" height="72" rx="12" class="client"/>
  <text x="440" y="178" text-anchor="middle" class="boxTitle">Cliente WEB</text>
  <text x="440" y="202" text-anchor="middle" class="boxText">web:lectura · web:resumen</text>

  <rect x="600" y="148" width="220" height="72" rx="12" class="client"/>
  <text x="710" y="178" text-anchor="middle" class="boxTitle">Cliente MÓVIL</text>
  <text x="710" y="202" text-anchor="middle" class="boxText">movil:lectura</text>

  <rect x="870" y="148" width="220" height="72" rx="12" class="client"/>
  <text x="980" y="178" text-anchor="middle" class="boxTitle">Cliente CAJERO</text>
  <text x="980" y="202" text-anchor="middle" class="boxText">cajero:lectura · cajero:retiro</text>

  <text x="60" y="265" class="section">Autenticación OAuth2</text>
  <rect x="380" y="245" width="400" height="112" rx="14" class="auth"/>
  <text x="580" y="278" text-anchor="middle" class="boxTitle">Authorization Server</text>
  <text x="580" y="302" text-anchor="middle" class="boxText">Puerto 9000 · client_credentials</text>
  <text x="580" y="326" text-anchor="middle" class="boxText">Emite JWT Bearer firmado con RSA</text>
  <text x="580" y="348" text-anchor="middle" class="small">Scopes diferenciados por canal</text>

  <path d="M170 220 L410 262" class="arrow"/>
  <path d="M440 220 L500 245" class="arrow"/>
  <path d="M710 220 L660 245" class="arrow"/>
  <path d="M980 220 L750 262" class="arrow"/>

  <text x="60" y="404" class="section">Capa BFF protegida con HTTPS + OAuth2 Resource Server</text>
  <rect x="120" y="425" width="300" height="100" rx="14" class="bff"/>
  <text x="270" y="458" text-anchor="middle" class="boxTitle">BFF WEB</text>
  <text x="270" y="482" text-anchor="middle" class="boxText">HTTPS :8081</text>
  <text x="270" y="505" text-anchor="middle" class="small">Valida JWT + issuer + aud + scope</text>

  <rect x="500" y="425" width="300" height="100" rx="14" class="bff"/>
  <text x="650" y="458" text-anchor="middle" class="boxTitle">BFF MÓVIL</text>
  <text x="650" y="482" text-anchor="middle" class="boxText">HTTPS :8082</text>
  <text x="650" y="505" text-anchor="middle" class="small">Contrato reducido por canal</text>

  <rect x="880" y="425" width="300" height="100" rx="14" class="bff"/>
  <text x="1030" y="458" text-anchor="middle" class="boxTitle">BFF CAJERO</text>
  <text x="1030" y="482" text-anchor="middle" class="boxText">HTTPS :8083</text>
  <text x="1030" y="505" text-anchor="middle" class="small">Saldo enmascarado + retiros</text>

  <path d="M520 357 L300 425" class="arrow"/>
  <path d="M580 357 L650 425" class="arrow"/>
  <path d="M650 357 L1010 425" class="arrow"/>

  <rect x="1235" y="245" width="290" height="112" rx="14" class="support"/>
  <text x="1380" y="278" text-anchor="middle" class="boxTitle">Config Server</text>
  <text x="1380" y="302" text-anchor="middle" class="boxText">Puerto 8888</text>
  <text x="1380" y="326" text-anchor="middle" class="small">Configuración centralizada</text>

  <rect x="1235" y="385" width="290" height="112" rx="14" class="support"/>
  <text x="1380" y="418" text-anchor="middle" class="boxTitle">Eureka Discovery Server</text>
  <text x="1380" y="442" text-anchor="middle" class="boxText">Puerto 8761</text>
  <text x="1380" y="466" text-anchor="middle" class="small">Registro y descubrimiento</text>

  <text x="60" y="576" class="section">Microservicios</text>
  <rect x="100" y="595" width="320" height="96" rx="14" class="ms"/>
  <text x="260" y="628" text-anchor="middle" class="boxTitle">MS-CUENTAS</text>
  <text x="260" y="653" text-anchor="middle" class="boxText">Puerto 8091</text>
  <text x="260" y="675" text-anchor="middle" class="small">Cuenta · interés · resumen</text>

  <rect x="500" y="595" width="320" height="96" rx="14" class="ms"/>
  <text x="660" y="628" text-anchor="middle" class="boxTitle">MS-MOVIMIENTOS</text>
  <text x="660" y="653" text-anchor="middle" class="boxText">Puerto 8092</text>
  <text x="660" y="675" text-anchor="middle" class="small">Movimientos + consumidor Kafka</text>

  <rect x="900" y="595" width="320" height="96" rx="14" class="ms"/>
  <text x="1060" y="628" text-anchor="middle" class="boxTitle">MS-OPERACIONES</text>
  <text x="1060" y="653" text-anchor="middle" class="boxText">Puerto 8093</text>
  <text x="1060" y="675" text-anchor="middle" class="small">Retiros + publicación Kafka</text>

  <path d="M270 525 L260 595" class="arrow"/>
  <path d="M650 525 L660 595" class="arrow"/>
  <path d="M1030 525 L1060 595" class="arrow"/>
  <path d="M390 525 C480 550, 520 565, 560 595" class="arrow"/>
  <path d="M890 525 C800 550, 760 565, 720 595" class="arrow"/>

  <path d="M1235 301 C1120 335, 1090 380, 1080 425" class="dash"/>
  <path d="M1235 441 C1170 485, 1160 535, 1150 595" class="dash"/>
  <path d="M1235 441 C990 525, 820 550, 810 595" class="dash"/>
  <path d="M1235 301 C1000 360, 760 400, 760 425" class="dash"/>

  <text x="60" y="748" class="section">Persistencia y mensajería asíncrona</text>
  <rect x="100" y="770" width="430" height="118" rx="18" class="db"/>
  <text x="315" y="807" text-anchor="middle" class="boxTitle">MySQL 8</text>
  <text x="315" y="834" text-anchor="middle" class="boxText">bank_xyz_semana5_db · Puerto 3306</text>
  <text x="315" y="860" text-anchor="middle" class="small">Persistencia accesible solo por microservicios</text>

  <path d="M260 691 L260 770" class="arrow"/>
  <path d="M660 691 C570 730, 480 750, 450 770" class="arrow"/>
  <path d="M1060 691 C900 735, 610 755, 500 790" class="arrow"/>

  <rect x="650" y="758" width="330" height="118" rx="18" class="kafka"/>
  <text x="815" y="797" text-anchor="middle" class="boxTitle">Apache Kafka</text>
  <text x="815" y="824" text-anchor="middle" class="boxText">Puerto 9092</text>
  <text x="815" y="850" text-anchor="middle" class="small">Eventos · reintentos · DLQ</text>

  <path d="M1060 691 C1040 735, 980 760, 960 790" class="arrow"/>
  <path d="M770 758 C745 730, 700 715, 680 691" class="arrow"/>

  <rect x="1030" y="752" width="420" height="58" rx="10" class="topicBox"/>
  <text x="1240" y="787" text-anchor="middle" class="topic">operaciones.procesadas</text>

  <rect x="1030" y="827" width="420" height="58" rx="10" class="topicBox"/>
  <text x="1240" y="862" text-anchor="middle" class="topic">operaciones.fallidas (DLQ)</text>

  <rect x="1030" y="902" width="420" height="58" rx="10" class="topicBox"/>
  <text x="1240" y="937" text-anchor="middle" class="topic">movimientos.creados</text>

  <path d="M980 805 L1030 781" class="arrow"/>
  <path d="M980 835 L1030 856" class="arrow"/>

  <rect x="650" y="905" width="330" height="74" rx="12" class="kafka"/>
  <text x="815" y="936" text-anchor="middle" class="boxTitle">Kafka UI</text>
  <text x="815" y="960" text-anchor="middle" class="boxText">Puerto 8090 · mensajes y consumidores</text>
  <path d="M815 876 L815 905" class="arrow"/>

  <rect x="80" y="930" width="500" height="128" rx="14" class="legend"/>
  <text x="105" y="962" class="boxTitle">Evidencias clave de la implementación</text>
  <text x="105" y="992" class="boxText">• OAuth2 con client_credentials y scopes por canal</text>
  <text x="105" y="1018" class="boxText">• HTTPS + JWT en BFF · Eureka · Config Server</text>
  <text x="105" y="1044" class="boxText">• Resilience4j · Kafka · reintentos · DLQ · Docker Compose</text>

  <text x="1210" y="1035" text-anchor="middle" class="small">Instancia AWS EC2 / Docker Compose</text>
</svg>