spring.application.name=bank-batch

# Conexion con MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bank_batch_db?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048}
spring.datasource.username=${DB_USER:bank_batch_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones: 3 trabajadores mas conexiones para metadatos y listeners
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Inicializacion de Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=true

# Job ejecutado por defecto
spring.batch.job.name=${BATCH_JOB_NAME:jobTransaccionesDiarias}

# Creacion de las tablas del proyecto
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Escalamiento solicitado para la Semana 2
batch.escalamiento.hilos=3
batch.escalamiento.chunk=5
batch.escalamiento.capacidad-cola=50

# Tolerancia a fallos y reinicio
batch.tolerancia.limite-omisiones=2000
batch.tolerancia.max-reintentos=3
batch.tolerancia.pausa-reintento-ms=250
batch.reinicio.max-ejecuciones-step=3

# Logs de ejecucion y rendimiento
logging.level.cl.duoc.bank_batch=INFO
logging.file.name=logs/bank-batch.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=5

# Reporte de transacciones diarias
batch.archivo.transacciones=${BATCH_ARCHIVO_TRANSACCIONES:data/semana_3/transacciones.csv}

# Calculo de intereses mensuales
batch.archivo.intereses=${BATCH_ARCHIVO_INTERESES:data/semana_3/intereses.csv}
batch.intereses.periodo=2024-01
batch.intereses.tasa-ahorro=0.005
batch.intereses.tasa-prestamo=0.015
batch.intereses.tasa-hipoteca=0.000

# Estados de cuenta anuales
batch.archivo.estados=${BATCH_ARCHIVO_ESTADOS:data/semana_3/cuentas_anuales.csv}
batch.estados.anio=2024
