spring.application.name=bank-bff-web
server.port=${BFF_WEB_PORT:8081}
bff.canal=WEB
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bank_xyz_semana5_db?useSSL=false&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:bank_batch_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
# La preparación del esquema se ejecuta una vez; las APIs no crean tablas al arrancar.
spring.sql.init.mode=never
logging.level.cl.duoc.bff=INFO
server.ssl.enabled=true
server.ssl.key-store=${BFF_TLS_STORE}
server.ssl.key-store-password=${BFF_TLS_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bff-tls
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
server.error.include-message=never
server.error.include-stacktrace=never
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024
bff.jwt-secret=${BFF_JWT_SECRET}
bff.token-seconds=300
bff.password=${BFF_LOGIN_PASSWORD}
bff.password-consulta=${BFF_READ_PASSWORD}
bff.cuenta-id=106
bff.issuer=urn:banco-xyz:web
bff.audience=bff-web
bff.usuario=web-demo
bff.usuario-consulta=web-consulta

server.address=127.0.0.1
