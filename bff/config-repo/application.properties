# Configuración centralizada Semana 6 - consumida por microservicios y BFF
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
backend.security.usuario=${BACKEND_BASIC_USER:svc-bff}
backend.security.password=${BACKEND_BASIC_PASSWORD:ChangeMe-Semana6-Backend!}
backend.security.viewer-usuario=${BACKEND_VIEWER_USER:viewer}
backend.security.viewer-password=${BACKEND_VIEWER_PASSWORD:ChangeMe-Semana6-Viewer!}
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,retries,retryevents
management.endpoint.health.show-details=always

resilience4j.circuitbreaker.instances.cuentasService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.cuentasService.sliding-window-size=5
resilience4j.circuitbreaker.instances.cuentasService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.cuentasService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cuentasService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.cuentasService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.movimientosService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.movimientosService.sliding-window-size=5
resilience4j.circuitbreaker.instances.movimientosService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.movimientosService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.movimientosService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.movimientosService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.operacionesService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.operacionesService.sliding-window-size=5
resilience4j.circuitbreaker.instances.operacionesService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.operacionesService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.operacionesService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.operacionesService.permitted-number-of-calls-in-half-open-state=2
resilience4j.retry.instances.cuentasService.max-attempts=3
resilience4j.retry.instances.cuentasService.wait-duration=400ms
resilience4j.retry.instances.movimientosService.max-attempts=3
resilience4j.retry.instances.movimientosService.wait-duration=400ms
resilience4j.retry.instances.operacionesService.max-attempts=2
resilience4j.retry.instances.operacionesService.wait-duration=500ms

# Las excepciones de negocio no cuentan como fallos de infraestructura.
resilience4j.circuitbreaker.instances.cuentasService.ignore-exceptions=cl.duoc.bff.compartido.excepcion.RecursoNoEncontradoException
resilience4j.retry.instances.cuentasService.ignore-exceptions=cl.duoc.bff.compartido.excepcion.RecursoNoEncontradoException
resilience4j.circuitbreaker.instances.operacionesService.ignore-exceptions=cl.duoc.bff.compartido.excepcion.RecursoNoEncontradoException,cl.duoc.bff.compartido.excepcion.SaldoInsuficienteException,cl.duoc.bff.compartido.excepcion.OperacionInvalidaException
resilience4j.retry.instances.operacionesService.ignore-exceptions=cl.duoc.bff.compartido.excepcion.RecursoNoEncontradoException,cl.duoc.bff.compartido.excepcion.SaldoInsuficienteException,cl.duoc.bff.compartido.excepcion.OperacionInvalidaException
