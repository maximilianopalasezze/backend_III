server.port=8082
bff.canal=MOVIL
bff.issuer=${OAUTH_ISSUER:http://localhost:9000}
bff.audience=bff-movil
bff.jwk-set-uri=${OAUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
server.ssl.enabled=true
server.ssl.key-store=${BFF_TLS_STORE}
server.ssl.key-store-password=${BFF_TLS_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bff-tls
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
server.error.include-message=never
server.error.include-stacktrace=never
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024
server.address=127.0.0.1

eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port=${server.port}
